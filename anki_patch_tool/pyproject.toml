[project]
name = "anki-patch-tool"
version = "0.1.0"
description = "GUI tool to reconcile an existing Anki collection against a corrected vocab/kanji export, via AnkiConnect"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyinstaller>=6.11.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anki_patch_tool"]
